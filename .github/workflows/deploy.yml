name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    **permissions:**  # ← THÊM DÒNG NÀY
      **contents: write**  # ← THÊM DÒNG NÀY
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # ← NÂNG V3 LÊN V4 (TỐT HƠN)

      - name: Setup Node
        uses: actions/setup-node@v4  # ← NÂNG LÊN V4
        with:
          node-version: 18

      - name: Install & Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4  # ← NÂNG LÊN V4 (MỚI NHẤT)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          force_orphan: true
